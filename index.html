<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude_research — dashboard</title>
<!--
  De voordeur van de gepubliceerde site.

  Dit bestand is GEEN tweede dashboard. Het dashboard is één gegenereerd bestand,
  dashboard/dashboard.html, gebouwd door ./dashboard/update.sh en door de
  workflow; een kopie hier zou de tweede renderer over één dataset zijn waar deze
  repo al eerder voor betaald heeft. Dit is een doorverwijzing.

  Waarom hij bestaat: GitHub Pages kan op twee manieren aanstaan.

    Source = GitHub Actions   .github/workflows/dashboard.yml zet _site/index.html
                              klaar als een kopie van het dashboard en publiceert
                              die. Dit bestand doet dan niets.
    Source = Deploy from a    GitHub serveert de branch zoals hij is. Dan is dit
    branch (main, / root)     bestand de voordeur en stuurt het door naar het
                              dashboard.

  De tweede route vraagt niets van GITHUB_TOKEN, en dat is precies de route die
  vandaag werkt: de eerste faalt op `configure-pages`, dat de site niet mag
  aanmaken, waarna de publicatie stil wordt overgeslagen.

  De hash gaat mee. Elk tabblad heeft een adres (#eu/deelmarkt, #us/drempel) en
  een doorverwijzing die dat weggooit, maakt elke gedeelde link stuk.
-->
<script>
  location.replace('dashboard/dashboard.html' + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=dashboard/dashboard.html"></noscript>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#f9f9f7; color:#0b0b0b;
         font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  @media (prefers-color-scheme: dark) { body { background:#0d0d0d; color:#fff; } }
  main { max-width:44ch; padding:24px; text-align:center; }
  a { color:#1a5fb4; }
  @media (prefers-color-scheme: dark) { a { color:#3987e5; } }
</style>
</head>
<body>
<main>
  <p>Doorsturen naar het dashboard.</p>
  <p><a href="dashboard/dashboard.html">dashboard/dashboard.html</a></p>
</main>
</body>
</html>
