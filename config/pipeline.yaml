# Daily earnings pipeline — the knobs every stage reads.
#
# Change values here rather than editing the skills. The two that actually move
# your usage bill are `shortlist_size` and `panel.names`; see docs/ROUTINES.md
# for the cost table before raising either.

timezone: Europe/Amsterdam        # all wall-clock times in the docs are this zone
data_branch: main                 # branch the routines commit research output to

universe:
  # Event window: after today's US close through before the next US open.
  min_market_cap_usd: 500000000
  require_listed_options: true
  exclude:
    - otc
    - spac_remnant
    - unconfirmed_timing        # conflicting BMO/AMC across sources
    - no_options_market

triage:
  # Stage 1 only earns its cost when the universe is crowded. Below this many
  # eligible names, every name goes straight through to the deep stage.
  skip_if_universe_at_or_below: 10
  # Cut from 10 to 6 on 2026-08-13. Ten dossiers a day never once completed: the
  # deep dive died mid-fan-out on every run between 08-08 and 08-12 and published
  # nothing at all. Six names is three per batch, which is a spike the plan
  # actually survives. Raise it again only after several consecutive days where
  # stage 2 publishes a full batch.
  shortlist_size: 6
  batch_size: 15                  # tickers per triage-scout subagent
  max_scouts: 6
  # priority = w_change * change_expectation + w_edge * ai_edge
  weight_change_expectation: 0.55
  weight_ai_edge: 0.45
  min_change_expectation: 35      # hard floor: a name that cannot move is not worth a dossier
  min_ai_edge: 30                 # hard floor: a name nobody can forecast is not worth a dossier

deep_dive:
  # 6 dossiers, split into two firings so the token burn lands in two different
  # rolling usage windows instead of one spike.
  batches: 2
  # Researchers go out in waves of this size, and the batch publishes after every
  # wave. This is the difference between losing one wave and losing the batch:
  # launching a whole batch in parallel means nothing is on disk until the first
  # agent returns, so a session killed during the fan-out leaves no trace at all.
  # That is exactly what happened on 08-11 and 08-12 — a valid shortlist sat
  # ready and stage 2 committed nothing, not even a blocked marker.
  wave_size: 2
  max_concurrent_subagents: 2     # = wave_size; platform cap is 20, but the
                                  # binding constraint here is the usage plan
  model: opus
  effort: high

panel:
  # Full seven-persona independent panel. This is the most expensive stage:
  # names x 7 opus/high subagents.
  # Cut from 3 to 2 on 2026-08-13 — first step of `budget.degrade_order`. Stage 3
  # is 7 opus/high agents per name; at 3 names it was 21 of the day's 31, and the
  # pipeline has never yet got far enough to spend them. Restore to 3 once stage 2
  # is reliably completing.
  names: 2                        # top N from the deep-dive ranking
  personas: 7
  max_concurrent_subagents: 7     # one full panel at a time
  model: opus
  effort: high
  # Ranking input for which names get a panel.
  rank_by:
    preliminary_conviction: 0.45  # |preliminary_direction_score| from the dossier
    evidence_completeness: 0.35   # a thin dossier makes for a worthless panel
    change_expectation: 0.20      # from triage

edge_hunt:
  # Stage E. Deliberately unlike every stage above it: the search is unconstrained
  # and only the output contract is fixed. Do not add a research checklist here.
  #
  # No market-cap floor, on purpose. FINDINGS.md §27 measured news coverage as a
  # near-monotonic function of market cap, so filtering the small names out would
  # turn every result into a statement about mega-caps.
  min_market_cap_usd: 0
  # One sweep agent screens the whole universe and kills stale calendar rows
  # before any deep hunter is spawned. On 2026-08-31 twelve names went to twelve
  # hunters and eight had no earnings event at all, each burning a full opus/high
  # budget to establish a fact one filing lookup settles.
  sweep_agents: 1
  # ONE HUNTER PER NAME. The double hunt on the top two was removed 2026-09-09.
  #
  # Over six runs it paired twelve names. The disagreement is real and large --
  # median gap 2.40 points on a key whose typical size is about 5, and FOUR OF THE
  # TWELVE pairs came back with opposite signs -- but it predicts nothing: the gap
  # against the eventual error ranks +0.203, against whether the sign was right
  # +0.028, both at n=12. So it bought no signal, and it cost two of twenty slots.
  #
  # What was given up is the only ongoing measurement of how REPRODUCIBLE the key
  # is. Run the same name twice and a third of the time you get the other sign.
  # That caveat now applies to every ranking and nothing in the stage re-measures
  # it. Re-run a double-hunt week occasionally rather than letting the number rot.
  double_hunt_top_n: 0
  hunters_per_other_name: 1
  wave_size: 4
  max_concurrent_subagents: 4
  model: opus
  effort: high
  # THE ADVERSARY IS REMOVED (2026-09-09). No daily pass, no weekly audit.
  #
  # It returned two numbers and both were measured as subtractive over 215 findings
  # on six resolved days. `size_check_pct`: summing the hunter's own size ranks at
  # rho=0.453 against 0.407 for the mean of the two. `priced_in_pct`: every way of
  # letting it touch the ranking makes it worse, monotonically in how much it is
  # allowed to remove -- the haircut 0.325, dropping findings at priced_in>=90 gives
  # 0.407, >=85 gives 0.402, >=80 gives 0.328, >=70 gives 0.221, keeping only <=50
  # gives 0.305. Mean priced_in per name ranks +0.046. And once impact_sum became
  # the key it reached the output through neither channel: eight subagents a day,
  # 40% of the cap, changing nothing that is ranked, scored or resolved.
  #
  # What is knowingly given up: it was the only thing in the stage that caught
  # factually wrong findings -- on 2026-09-09 a covenant amendment misread by a year
  # and a short-interest claim contradicted by its own source. Those now enter the
  # key unchecked. Accepted because a check with no path to the output is not a
  # check, and because sample size is what every open question is waiting on.
  #
  # `.claude/agents/priced-in-adversary.md`, `researcher_us/scripts/edge_brief.py` and
  # `researcher_us/scripts/edge_adversary_brief.py` are left in the tree unused, so the pass can be
  # re-run deliberately over a week if the priced-in question is ever reopened.
  adversary_agents_per_ticker: 0
  # Every slot the sweep leaves goes to hunters: 1 + 19 = 20.
  hunted_names: 19
  # No threshold and no call. edge_score.py emits one signed number per company --
  # `impact_sum`, the hunters' signed per-finding sizes added up, in points of spot
  # -- and the day is ranked on it; any cut is applied by the reader afterwards,
  # which is what keeps "can these be ranked" answerable at every k. A threshold
  # here would put a category back into the output.
  #
  # impact_sum became the key on 2026-09-09. researcher_us/EDGE_ANALYSIS.md decomposed six
  # resolved runs: the raw sum ranked at rho=0.407 (p=0.017) while the same numbers
  # after the cluster-max, the sqrt(k) discount, the agreement discount and the
  # quality multiplier ranked at 0.243 (p=0.156). Paired bootstrap over days puts
  # the gap at +0.165, CI [+0.082, +0.244]. The machinery is still computed, into
  # `diagnostics`, but it decides nothing.
  #
  # Where a reader should start believing the SIGN, in points of spot. Not a filter:
  # edge-scores.json still carries every name, because the ranking test needs the
  # complete table. It governs emphasis in the note.
  #
  # Measured on 38 events over six days: over all of them the sign of impact_sum is
  # a coin flip (53% to the next close), but the RANK of conviction predicts whether
  # the sign was right at rho=+0.514, permutation p=0.0015. |impact_sum| >= 3 gave
  # 16/21 and +6.37% per trade; >= 8 gave 8/9. Best-of-seven-thresholds still clears
  # family-wise correction at p=0.034. Re-derive this from the pooled sample rather
  # than treating 3.0 as settled.
  conviction_floor: 3.0

japan_hunt:
  # Stage J. The same question as `edge_hunt`, asked of the Tokyo market, and
  # deliberately scored by the SAME scorer (researcher_us/scripts/edge_score.py) so
  # the two markets' numbers mean the same thing. RESEARCH ONLY -- there is no
  # execution block here and there must not be one.
  #
  # THE CAP AND THE DRAW. In season JPX's calendar carries up to 125 names on one
  # date and TDnet saw 456 releases on 2026-08-14. One hunter per name means the day
  # has to be cut, and the cut is two steps: drop microcaps on turnover, then draw
  # at random from what is left, seeded by the date.
  #
  # Random rather than by any priority score, because a non-random cut is a second
  # ranking the scorer cannot see. The US run has already paid for this once: its two
  # highest-hunt_priority names each got two hunters, the key is a SUM, so those names
  # carried the largest conviction by construction and edge_hunter_control.py had to
  # rebuild all 38 events to find out how much of the headline was the selection
  # rather than the finding. A seeded draw cannot do that, and `eligible_codes` in the
  # universe file carries the population the draw came from.
  cap: 25
  # Median 20-day turnover floor, in yen. 3e7 JPY is about $200k/day at 150, which is
  # the same capacity bar `execution.benchmark.min_dollar_volume_usd` screens on, so
  # the two markets' universes are cut on one number rather than two chosen apart.
  #
  # BE CLEAR WHAT IT COSTS: the Japanese tail is far thinner than the US one. On the
  # 62 names scheduled for 2026-10-09 the median was 7,367,800 JPY a day (~$49k) and
  # this floor kept 40%. The ranked universe is the liquid half of the day and is not
  # a sample of Japanese listed companies. That is the "deselect microcaps" step and
  # it is intended, but it is a selection and it belongs in the note.
  min_turnover_jpy: 30000000
  # ONE HUNTER PER NAME, for the reason edge_hunt.double_hunt_top_n records: over
  # twelve paired US names the gap between two hunters predicted neither the error
  # (+0.203) nor whether the sign was right (+0.028).
  hunters_per_name: 1
  wave_size: 4
  max_concurrent_subagents: 4
  model: opus
  effort: high
  # No sweep agent. The US sweep exists to kill phantom calendar rows, and Japan's
  # calendar is the issuer's own notified date carried by JPX -- a different and much
  # stronger object than the Nasdaq feed, whose `time-not-supplied` rows were 20 of 20
  # phantom on 2026-09-17. The hunter re-checks a stale `calendar_as_of` itself.
  sweep_agents: 0
  # Inherits edge_hunt.conviction_floor unless set. A floor on EMPHASIS in the note,
  # never a filter on the scored file.
  conviction_floor: null
  # THE ANCHOR SUBSTITUTES (2026-09-18). Japan has no single-stock option chain, so the
  # baseline builds its own lean from JPX's disclosed short register, the change in that
  # register, and 信用倍率. Every weight in jp_priced_in.lean_components() is a PRIOR
  # borrowed from the US runs; jp_resolve.py ranks each component separately so they can
  # be replaced by measurement. Cut a component's weight to zero when several pooled days
  # rank it at or below zero -- do not argue for it.
  #
  # The number that says the fix is still working is `lean_vs_free_control_rho` in the
  # resolved file. It was 1.0 by construction before this shipped and measured 0.446-0.59
  # on the 2026-09-11 universe. If it returns to 1.0 the positioning sources have stopped
  # resolving and the lean has silently fallen back to the run-up alone.
  margin_ratio_lookup: true      # one scraped request per name; false skips it
  degrade_order:
    - skip the scraped margin ratio (positioning falls back to the JPX register alone)
    - reduce cap to 15 names
    - reduce cap to 8 names
    - skip the note's per-name critical read, keep the ranked table
    - publish the ranking with fewer names and say which were shed

output:
  disclaimer: >-
    This is research, not financial advice. Earnings reactions are highly uncertain
    and can be driven by market positioning, guidance, macro conditions, and
    management commentary rather than reported results alone.

budget:
  # Soft guardrails. Each stage logs what it spent to _run-log.md; a stage that
  # would exceed its cap sheds scope (fewer panel names, fewer dossiers) and
  # records that it did so rather than silently running long.
  max_subagents_per_stage:
    triage: 6
    deep_dive_batch: 3
    panel: 14
    edge_hunt: 20                 # sweep + hunters + adversaries, whole stage
  degrade_order:
    - reduce_panel_names_to_2
    - reduce_panel_names_to_1
    - skip_lowest_ranked_dossiers
  # Shed in this order when the edge hunt would exceed its cap. Hunters go before
  # adversaries: an unhunted name scores zero and drops out cleanly, while an
  # unjudged finding still carries partial weight into a call.
  # Shed NAMES before shedding rigour on the names you keep. A name dropped here
  # sits out of the ranking as `rankable: false` with a stated reason, which is
  # visible and honest; a name kept but measured worse corrupts the ranking silently.
  #
  # Reordered after 2026-08-31, when the first two entries of the previous order
  # each contradicted a hard rule stated elsewhere and the run had to deviate and
  # document the deviation:
  #   - `single_hunter_on_every_name` was step 1, but both the skill and the routine
  #     prompt forbid economising the two-hunter split -- it is the only place
  #     independence is actually measured, and on run 1 it produced the most
  #     informative output of the day.
  #   - `adversary_on_the_largest_findings_only` reintroduced run 1's central flaw:
  #     an unjudged finding defaults to mostly-priced, so judging only some findings
  #     mechanically favours whichever side goes unattacked. Full adversary coverage
  #     is now a floor, not a degradation step. It is also the cheapest part of the
  #     stage -- one agent per ticker regardless of finding count.
  edge_degrade_order:
    - drop_unconfirmed_names_first          # the sweep could not source a date
    - drop_lowest_hunt_priority_names       # fewest names, full rigour on each
    - hunt_only_names_the_sweep_ranked_above_median_priority
  # `single_hunter_on_every_name` used to sit here as a last resort. It is the
  # default since 2026-09-09, so there is nothing left to shed but names.
  # Never degraded, at any budget: the sealed-baseline-before-launch ordering, the
  # two-hunter split on the top two names, and -- ON AUDIT DAY ONLY -- adversary
  # coverage of every finding on both sides. Full coverage stopped being a daily
  # floor on 2026-09-09 when both of the adversary's numeric channels were measured
  # as subtractive; on audit day it is still all-or-nothing, because judging only
  # some findings reintroduces run 1's central flaw (an unjudged finding defaults to
  # mostly-priced, so partial coverage favours whichever side goes unattacked).
  # One rule left, and it is the one that makes the whole exercise honest: a
  # baseline written after a finding exists is one the finding has contaminated.
  edge_never_degrade:
    - baselines_sealed_and_committed_before_any_agent_launches

execution:
  # Stage E's ranking placed as real orders at Alpaca, by researcher_us/scripts/alpaca_trade.py.
  # OFF until someone turns it on deliberately. With `enabled: false` every
  # invocation is a dry run that writes alpaca-plan.json and submits nothing, and
  # --submit alone will not override it.
  enabled: true
  broker: alpaca
  # The endpoint comes from $ALPACA_BASE_URL and defaults to the paper API. A
  # non-paper endpoint additionally needs --live-account-i-understand on the
  # command line. Credentials are read from $ALPACA_API_KEY_ID and
  # $ALPACA_API_SECRET_KEY and are never written into this repo.
  assumed_equity_usd: 100000     # sizing basis for dry runs with no account attached

  benchmark:
    # ONE rule, and it is the only cut in researcher_us/EDGE_ANALYSIS.md that survived a
    # family-wise correction: |impact_sum| >= the floor, side from the sign. Above
    # the floor the sign was right on 16 of 21 events, +6.37% per trade (t=2.74,
    # +4.87% after a 1.5% cost); over all 38 events it is 53%, a coin flip. That is
    # 5 independent days. Do not raise the exposure below on the strength of it.
    key: impact_sum
    min_conviction: null         # null inherits edge_hunt.conviction_floor (3.0)
    require_rankable: true       # an unconfirmed event is not a trade
    # Capacity, which is in neither the scorer nor the budget. Names below this floor
    # are dropped outright rather than sized down.
    #
    # $200k since 2026-09-10, down from $5m, on the operator's reading that the real
    # spread in these names is far below the 1.5% round trip the analysis charges.
    # BE CLEAR ABOUT WHAT THAT COSTS: on the 38 resolved events the floor helped
    # monotonically -- $5m gave 11/12 and +8.09% a trade against 15/18 and +5.86% at
    # $200k -- so this loosening is against the sample, not with it. It is defensible
    # on two grounds the sample cannot speak to: the spread, and the event rate (18
    # of 38 events trade here against 12 at $5m, which is how the forward sample
    # grows). Re-run researcher_us/scripts/edge_turnover_floor.py as days pool and move it back if
    # the added names keep underperforming.
    min_dollar_volume_usd: 200000
    # Not a floor. Below this the note calls the name THIN: the proxy for a broker's
    # limited-liquidity warning, which the operator does not trade into. `assets`
    # prints it beside borrow, and nothing is dropped on it.
    thin_dollar_volume_usd: 1000000
    # No cap on the count. Equal weight means more names is smaller positions, not
    # more risk, and cutting the tail would be a second selection rule on top of the
    # only one that was measured.
    max_positions: null

  sizing:
    # EQUAL WEIGHT, WHOLE BUDGET. Every name that clears the benchmark gets the same
    # dollars: the gross budget split N ways, capped per name, with whatever a capped
    # name cannot take redistributed equally over the rest. Nothing here reads the
    # score. `impact_sum` ranks and does not size -- median absolute error 6-7 points
    # against a realised standard deviation near 11 -- so weighting by it would be
    # sizing on a number that has no measured relationship to the size of the move.
    #
    # 100% gross is the whole account, unhedged, through five to nine earnings prints
    # a night. Two names in the resolved sample gapped 22-23% (NX +22.23%,
    # CANG -23.01%): at a 33% weight either one moves the account by about 7.5%.
    # Reg T allows twice equity overnight, so 100% fits, but nothing here is a stop.
    gross_exposure_pct_of_equity: 100
    # 2026-09-17: raised from 20 to 33 on the operator's instruction. A third of
    # equity per name is the stated ceiling, so three names now fill the book where
    # five did before. What that costs is concentration, and the number above is the
    # whole of it: the same 23% gap that moved the account 4.5% at a 20% cap moves it
    # about 7.5% here, and on a two-name day the book is 66% in two prints rather
    # than 40%. Nothing in this stage is hedged and nothing is stopped out, so the
    # cap IS the risk control. Raising it further has no measured support: the only
    # rule that survived a family-wise correction is which names to hold, never how
    # much of one to hold.
    max_position_pct_of_equity: 33
    # Below three names every position hits that 33% and the account is deliberately
    # under-deployed. That is the cap doing its job, not a bug to route around.
    #
    # Slippage guard, kept but loose: a market-on-close order this size is a share of
    # the closing auction, and in a thin name that share is the cost. At $10k of
    # equity a 33% position is $3,300, which is 1.65% of a $200k/day name -- so with
    # the guard at 1.0% of ADV, capacity now binds before equity does in the thinnest
    # tradable names, and the redistribution that follows is the leftover going to
    # the rest of the book. Set to null to disable it entirely; the plan prints %adv
    # per name either way.
    max_position_pct_of_adv: 1.0
    min_position_usd: 200

  orders:
    # Sell everything at the start of the run, at market, before the new book goes
    # in. The account is rebuilt from scratch every day.
    #
    # This is safe at that moment for one reason: when the edge hunt fires, every
    # position in the account has already been through its print, so nothing is cut
    # short of its event. It is NOT free. The measured exit is the next CLOSE
    # (direction rho=+0.514, permutation p=0.0015); selling at the start of the run
    # is nearer the next OPEN, which measured weaker on the same events (rho=+0.331,
    # p=0.046). Ten to twenty basis points of that gap is the price of a one-run-a-day
    # operation with no overnight order to babysit.
    #
    # 2026-09-11: set to false -- required alongside exit_mode: auction_split, since
    # the flatten would otherwise sell every amc leg at market hours before its
    # opening auction. `open`'s own refusal (any position past its exit date with no
    # exit submitted blocks a new book) is the safety net this now relies on.
    flatten_before_entry: false
    # BUY IMMEDIATELY, at market, the moment the note is published -- not in the
    # closing auction, which is the entry edge_resolve.py scores.
    #
    # Measured both ways on the same 18 traded events: market-on-close 15/18 and
    # +5.86% a trade, a market order at 14:00 ET 14/18 and +5.82%. Four hundredths
    # of a point per trade, and one event of eighteen changing sign (PL, 09-03).
    # Re-run researcher_us/scripts/edge_entry_timing.py as days pool.
    #
    # What that measurement CANNOT see is the spread. It compares trade prices, not
    # fills, and the closing auction is the deepest liquidity of the day -- which
    # matters more since the turnover floor dropped to $200k, not less. If fills come
    # back worse than the plan's notional by more than a few tenths of a percent,
    # this is the first knob to put back: `market_on_close` returns to the auction,
    # at the cost of a pending order and Alpaca's cutoff ten minutes before the bell.
    entry: market
    # Only `close` reads this, and `close` is the fallback path (see
    # flatten_before_entry). There the auction is free: the order goes in on the exit
    # date with nothing else waiting on it.
    exit: market_on_close
    # Give the two sessions the exits they were separately measured to want, instead
    # of one instrument for the whole book. Only `close` reads it, and only when
    # `exit` is the auction path. Per trade over the 38 de-duplicated events:
    #
    #                 opening auction        closing auction
    #   amc           +8.91% (t=3.20)        +5.23% (t=1.48)
    #   bmo           +2.96% (t=1.01)        +6.48% (t=2.34)
    #
    # An amc print gets a whole overnight of processing, so the opening auction is
    # already the informed price and the session that follows takes about three
    # points back (open-to-close leg rho=-0.351, -2.61% day-demeaned on a book that
    # is six long and six short, so it is not market drift). A bmo print gets two
    # thin hours of pre-market and keeps repricing all day: rho +0.187 at the open
    # against +0.670 at the close. Combined the split gave +7.81% a trade (t=4.01)
    # against +5.80% for one uniform close exit.
    #
    # OFF, and three things have to change before that is wrong. (1) The split was
    # read off the same 38 events it is justified by: the paired day bootstrap puts
    # its gain at +1.87pp with a 95% interval of [-1.30, +4.55], and the best of six
    # candidate rules beats the close in 91% of resamples, which describes the sample
    # rather than testing it. (2) It does not replicate yet -- on 09-08 and 09-09
    # every exit hour available on both days paid between -1.42% and -0.05% a trade,
    # and on 09-09 shorting the day blind beat the book by about five points.
    # (3) backtest/RESULTS.md prices 37 independent sealed events at both exits and
    # all three arms did BETTER at the close (+2.16% against +0.90% for arm A).
    # Re-price those 37 on researcher_us/scripts/edge_exit.py's hourly grid before turning this on.
    #
    # WHICH INSTRUMENT CLOSES A POSITION, per session. Three schemes, measured on the
    # same 22 trades of the conviction book over 38 de-duplicated events:
    #
    #   uniform        +4.49% (t=2.52)  what ships. flatten_before_entry sells the
    #                  whole book at market when the next run starts, ~10:00 ET
    #   bmo_close      +6.27% (t=3.34)  amc at market on the run, bmo into TODAY's
    #                  closing auction. ONE run. Needs only
    #                  flatten_before_entry: false -- no new Routine
    #   auction_split  +7.81% (t=4.01)  amc into the OPENING auction, bmo into the
    #                  closing auction. Needs a SECOND Routine at 14:00 Amsterdam
    #
    # Per trade over those events the two sessions want opposite things: amc pays
    # +8.91% in the opening auction, +6.08% at ~10:00 ET and +5.23% at the close;
    # bmo pays +2.96%, +2.58% and +6.48%. An amc print has had a whole overnight to
    # be processed, so the opening auction is already the informed price; a bmo print
    # has had two thin hours of pre-market and keeps repricing all day.
    #
    # `bmo_close` is where the cheap money is: +1.77pp of the +3.32pp on offer, and
    # it needs no machinery that does not already exist. `auction_split` buys the
    # other +1.54pp and needs a second daily firing, because Alpaca REJECTS rather
    # than queues an `opg` order between 09:28 and 19:00 ET -- nothing that fires in
    # the European afternoon can sell an amc position into its own opening auction.
    # The prompt is in researcher_us/routine-prompts/edge-execute.md and only a person can
    # create it; create_trigger is refused to agent sessions in this environment.
    #
    # NEITHER IS ESTABLISHED. The split was read off the same 38 events it is
    # justified by; on the first two forward days (09-08, 09-09) every exit hour
    # available on both paid between -1.42% and -0.05% a trade; and
    # backtest/RESULTS.md puts the close ahead of the open on its own 37 sealed
    # events for all three arms. Re-price those 37 on researcher_us/scripts/edge_exit.py's hourly
    # grid -- this operator decision does not wait for that.
    #
    # 2026-09-11: switched to `auction_split` on the operator's explicit instruction,
    # replication risk acknowledged and accepted. The requirement is that amc legs
    # always exit into the opening auction rather than sit until stage E's own
    # flatten at ~13:04 ET. See "Close AMC" (trig_01MPuhVvtDgvUYzZXkKpHpKD).
    #
    # Either non-uniform mode also needs `flatten_before_entry: false`, or the
    # flatten sells everything before any auction arrives. Since 2026-09-10 the
    # half-set config is REFUSED rather than merely documented: exit_mode() raises on
    # any non-uniform mode while flatten_before_entry is true, so `open`, `close` and
    # `mode` all fail loudly instead of running the exit the config did not ask for.
    # Getting it wrong never loses the book either way: `close` sends anything past
    # its exit date at plain market on the next run, and `open` REFUSES to enter a new
    # book while a position is overdue and unsold.
    #
    # 2026-09-15: switched to `amc_open` on the operator's requirement that a bmo leg
    # is gone before the same afternoon buys the next book. amc still goes into the
    # opening auction from the "Close AMC" Routine; bmo goes at plain MARKET on stage
    # E's own run at 13:05 ET instead of into that day's closing auction.
    #
    # It is measurably worse on the fitted sample and that is accepted, not missed:
    # +6.49% a trade (t=3.42, rho 0.391, 16/22) against +7.81% (t=4.01, rho 0.461,
    # 17/22) for auction_split. 1.31pp. What the 7.81 cannot see is that the bmo leg
    # of it has not actually been selling: a `cls` order crosses once and takes the
    # size the contra side brings, which here was 39 of 183 (CODA) and 17 of 161
    # (HOFT) before expiring, with the rest sold at market one to three days later.
    # And a bmo position still open at 13:05 ET is still open when step 7 buys at
    # 13:24 ET, so gross exposure stacks -- VRA and FPS were held through LUXE's
    # entry on 09-15. A market sell at 13:05 ET is verifiable inside the same session,
    # so the budget the entry divides is known to be free.
    #
    # researcher_us/scripts/edge_exit.py scores this as the `amc_open_bmo_1300` policy. Re-run
    # it as days pool; against uniform_close it leads by only +0.57pp on a paired day
    # bootstrap of [-2.86, +3.18], so nothing here is established.
    exit_mode: amc_open      # uniform | bmo_close | auction_split | amc_open
    # WHICH RUN SELLS WHICH LEG, since 2026-09-18. `close` takes every leg whose exit
    # date is today and TWO runs a day call it -- "Close AMC" at 06:05 ET and stage E
    # at 13:05 ET -- so the early run was taking the bmo leg as well. Under
    # auction_split that was harmless (bmo wanted `cls`, which a closed market
    # refuses); under amc_open the bmo instrument is a plain DAY order, which Alpaca
    # QUEUES FOR THE OPEN. On 2026-09-18 TRT's bmo exit went in at 06:07 ET that way,
    # so the book was running amc at the open and bmo at the open -- and bmo is the
    # session that measured worst there (+2.96% against +6.48% at the close and
    # +2.58% around 10:00 ET). `close` now leaves a leg whose placement is `market`
    # to the run that fires inside the session. Overdue legs are exempt and still go
    # immediately.
    # MAY THIS ACCOUNT USE `opg`/`cls` AT ALL? No, since 2026-09-18, and the mode
    # above is unchanged: amc is still aimed at the open, it just gets there as a
    # plain market DAY order queued in the pre-market instead of as an auction order.
    #
    # Ten auction exit legs have been sent from this book and ONE filled in full
    # (ORCL 12 of 12). Two part-filled and expired (HOFT 17 of 161, CODA 39 of 183)
    # and seven filled nothing -- most tellingly LEN on 2026-09-17, a buy-to-cover of
    # 28 shares of a $20bn homebuilder, expired at 09:30:52 ET with zero filled. That
    # is not liquidity. Alpaca's own order-types page: "OPG and CLS orders are only
    # available to Elite Smart Router users", which this $11.5k paper account is not;
    # and paper fills are simulated against the NBBO quote stream with "partial fills
    # for a random size 10% of the time", which describes the 17-of-161 exactly.
    #
    # WHAT IT COSTS. The measured +8.91% for an amc opening-auction exit was priced at
    # the 09:30 cross; a queued market order fills in the first seconds of continuous
    # trading instead, which is a few basis points away in a liquid name and more in a
    # thin one. Against an order that does not sell at all it is not close: the last
    # three amc legs were rescued by hand hours later, or not at all.
    #
    # Set back to true only on an account genuinely on the Elite Smart Router, and
    # only after `verify` shows an auction leg filling in FULL.
    auction_orders: false
    time_in_force: day           # market entries, and the plain-market fallback
    # AFTER the exits go in, wait this many seconds and re-read every one of them at
    # the broker. A submitted sell is not a sold position, and until 2026-09-15
    # nothing here ever looked: `send` stored the status Alpaca returns at
    # submission -- always `pending_new` -- and the session ended. The only thing
    # that noticed an exit which had not sold was the NEXT run's held-position
    # check, 17 to 24 hours later.
    #
    # What was being missed is that `cls` and `opg` are not market orders. Each
    # crosses ONCE and takes whatever size the contra side brings, which in a
    # $200k-a-day name is often almost none: HOFT 17 of 161 (2026-09-11, cls),
    # CODA 39 of 183 (09-14, cls), RLGT 0 of 224 (09-15, opg).
    #
    # Five minutes cannot verify an auction order -- it is still `new`, correctly,
    # for hours -- and the check says `working` rather than pretending otherwise.
    # What it does catch the same session is the order that was rejected, expired
    # or never left the gate. Set to 0 to look immediately; -1 on the command line
    # (`--no-verify`) skips it.
    fill_check_seconds: 300
    # When the check finds shares still held behind an order that is DEAD at the
    # broker, re-send the residual at plain market rather than leaving it for
    # tomorrow. Sized to what Alpaca reports is still held, never to the entry qty,
    # and only when every order for that leg is dead -- the same invariant that
    # keeps `close` from selling a position twice.
    fill_check_fix: true
    allow_shorts: true           # a short leg also needs Alpaca to call it shortable
