# Daily earnings pipeline — the knobs every stage reads.
#
# Change values here rather than editing the skills. The two that actually move
# your usage bill are `shortlist_size` and `panel.names`; see docs/ROUTINES.md
# for the cost table before raising either.

timezone: Europe/Amsterdam        # all wall-clock times in the docs are this zone
data_branch: main                 # branch the routines commit research output to

universe:
  # Event window: after today's US close through before the next US open.
  min_market_cap_usd: 500000000
  require_listed_options: true
  exclude:
    - otc
    - spac_remnant
    - unconfirmed_timing        # conflicting BMO/AMC across sources
    - no_options_market

triage:
  # Stage 1 only earns its cost when the universe is crowded. Below this many
  # eligible names, every name goes straight through to the deep stage.
  skip_if_universe_at_or_below: 10
  # Cut from 10 to 6 on 2026-08-13. Ten dossiers a day never once completed: the
  # deep dive died mid-fan-out on every run between 08-08 and 08-12 and published
  # nothing at all. Six names is three per batch, which is a spike the plan
  # actually survives. Raise it again only after several consecutive days where
  # stage 2 publishes a full batch.
  shortlist_size: 6
  batch_size: 15                  # tickers per triage-scout subagent
  max_scouts: 6
  # priority = w_change * change_expectation + w_edge * ai_edge
  weight_change_expectation: 0.55
  weight_ai_edge: 0.45
  min_change_expectation: 35      # hard floor: a name that cannot move is not worth a dossier
  min_ai_edge: 30                 # hard floor: a name nobody can forecast is not worth a dossier

deep_dive:
  # 6 dossiers, split into two firings so the token burn lands in two different
  # rolling usage windows instead of one spike.
  batches: 2
  # Researchers go out in waves of this size, and the batch publishes after every
  # wave. This is the difference between losing one wave and losing the batch:
  # launching a whole batch in parallel means nothing is on disk until the first
  # agent returns, so a session killed during the fan-out leaves no trace at all.
  # That is exactly what happened on 08-11 and 08-12 — a valid shortlist sat
  # ready and stage 2 committed nothing, not even a blocked marker.
  wave_size: 2
  max_concurrent_subagents: 2     # = wave_size; platform cap is 20, but the
                                  # binding constraint here is the usage plan
  model: opus
  effort: high

panel:
  # Full seven-persona independent panel. This is the most expensive stage:
  # names x 7 opus/high subagents.
  # Cut from 3 to 2 on 2026-08-13 — first step of `budget.degrade_order`. Stage 3
  # is 7 opus/high agents per name; at 3 names it was 21 of the day's 31, and the
  # pipeline has never yet got far enough to spend them. Restore to 3 once stage 2
  # is reliably completing.
  names: 2                        # top N from the deep-dive ranking
  personas: 7
  max_concurrent_subagents: 7     # one full panel at a time
  model: opus
  effort: high
  # Ranking input for which names get a panel.
  rank_by:
    preliminary_conviction: 0.45  # |preliminary_direction_score| from the dossier
    evidence_completeness: 0.35   # a thin dossier makes for a worthless panel
    change_expectation: 0.20      # from triage

edge_hunt:
  # Stage E. Deliberately unlike every stage above it: the search is unconstrained
  # and only the output contract is fixed. Do not add a research checklist here.
  #
  # No market-cap floor, on purpose. FINDINGS.md §27 measured news coverage as a
  # near-monotonic function of market cap, so filtering the small names out would
  # turn every result into a statement about mega-caps.
  min_market_cap_usd: 0
  # One sweep agent screens the whole universe and kills stale calendar rows
  # before any deep hunter is spawned. On 2026-08-31 twelve names went to twelve
  # hunters and eight had no earnings event at all, each burning a full opus/high
  # budget to establish a fact one filing lookup settles.
  sweep_agents: 1
  # ONE HUNTER PER NAME. The double hunt on the top two was removed 2026-09-09.
  #
  # Over six runs it paired twelve names. The disagreement is real and large --
  # median gap 2.40 points on a key whose typical size is about 5, and FOUR OF THE
  # TWELVE pairs came back with opposite signs -- but it predicts nothing: the gap
  # against the eventual error ranks +0.203, against whether the sign was right
  # +0.028, both at n=12. So it bought no signal, and it cost two of twenty slots.
  #
  # What was given up is the only ongoing measurement of how REPRODUCIBLE the key
  # is. Run the same name twice and a third of the time you get the other sign.
  # That caveat now applies to every ranking and nothing in the stage re-measures
  # it. Re-run a double-hunt week occasionally rather than letting the number rot.
  double_hunt_top_n: 0
  hunters_per_other_name: 1
  wave_size: 4
  max_concurrent_subagents: 4
  model: opus
  effort: high
  # THE ADVERSARY IS REMOVED (2026-09-09). No daily pass, no weekly audit.
  #
  # It returned two numbers and both were measured as subtractive over 215 findings
  # on six resolved days. `size_check_pct`: summing the hunter's own size ranks at
  # rho=0.453 against 0.407 for the mean of the two. `priced_in_pct`: every way of
  # letting it touch the ranking makes it worse, monotonically in how much it is
  # allowed to remove -- the haircut 0.325, dropping findings at priced_in>=90 gives
  # 0.407, >=85 gives 0.402, >=80 gives 0.328, >=70 gives 0.221, keeping only <=50
  # gives 0.305. Mean priced_in per name ranks +0.046. And once impact_sum became
  # the key it reached the output through neither channel: eight subagents a day,
  # 40% of the cap, changing nothing that is ranked, scored or resolved.
  #
  # What is knowingly given up: it was the only thing in the stage that caught
  # factually wrong findings -- on 2026-09-09 a covenant amendment misread by a year
  # and a short-interest claim contradicted by its own source. Those now enter the
  # key unchecked. Accepted because a check with no path to the output is not a
  # check, and because sample size is what every open question is waiting on.
  #
  # `.claude/agents/priced-in-adversary.md`, `scripts/edge_brief.py` and
  # `scripts/edge_adversary_brief.py` are left in the tree unused, so the pass can be
  # re-run deliberately over a week if the priced-in question is ever reopened.
  adversary_agents_per_ticker: 0
  # Every slot the sweep leaves goes to hunters: 1 + 19 = 20.
  hunted_names: 19
  # No threshold and no call. edge_score.py emits one signed number per company --
  # `impact_sum`, the hunters' signed per-finding sizes added up, in points of spot
  # -- and the day is ranked on it; any cut is applied by the reader afterwards,
  # which is what keeps "can these be ranked" answerable at every k. A threshold
  # here would put a category back into the output.
  #
  # impact_sum became the key on 2026-09-09. docs/EDGE_ANALYSIS.md decomposed six
  # resolved runs: the raw sum ranked at rho=0.407 (p=0.017) while the same numbers
  # after the cluster-max, the sqrt(k) discount, the agreement discount and the
  # quality multiplier ranked at 0.243 (p=0.156). Paired bootstrap over days puts
  # the gap at +0.165, CI [+0.082, +0.244]. The machinery is still computed, into
  # `diagnostics`, but it decides nothing.
  #
  # Where a reader should start believing the SIGN, in points of spot. Not a filter:
  # edge-scores.json still carries every name, because the ranking test needs the
  # complete table. It governs emphasis in the note.
  #
  # Measured on 38 events over six days: over all of them the sign of impact_sum is
  # a coin flip (53% to the next close), but the RANK of conviction predicts whether
  # the sign was right at rho=+0.514, permutation p=0.0015. |impact_sum| >= 3 gave
  # 16/21 and +6.37% per trade; >= 8 gave 8/9. Best-of-seven-thresholds still clears
  # family-wise correction at p=0.034. Re-derive this from the pooled sample rather
  # than treating 3.0 as settled.
  conviction_floor: 3.0

output:
  disclaimer: >-
    This is research, not financial advice. Earnings reactions are highly uncertain
    and can be driven by market positioning, guidance, macro conditions, and
    management commentary rather than reported results alone.

budget:
  # Soft guardrails. Each stage logs what it spent to _run-log.md; a stage that
  # would exceed its cap sheds scope (fewer panel names, fewer dossiers) and
  # records that it did so rather than silently running long.
  max_subagents_per_stage:
    triage: 6
    deep_dive_batch: 3
    panel: 14
    edge_hunt: 20                 # sweep + hunters + adversaries, whole stage
  degrade_order:
    - reduce_panel_names_to_2
    - reduce_panel_names_to_1
    - skip_lowest_ranked_dossiers
  # Shed in this order when the edge hunt would exceed its cap. Hunters go before
  # adversaries: an unhunted name scores zero and drops out cleanly, while an
  # unjudged finding still carries partial weight into a call.
  # Shed NAMES before shedding rigour on the names you keep. A name dropped here
  # sits out of the ranking as `rankable: false` with a stated reason, which is
  # visible and honest; a name kept but measured worse corrupts the ranking silently.
  #
  # Reordered after 2026-08-31, when the first two entries of the previous order
  # each contradicted a hard rule stated elsewhere and the run had to deviate and
  # document the deviation:
  #   - `single_hunter_on_every_name` was step 1, but both the skill and the routine
  #     prompt forbid economising the two-hunter split -- it is the only place
  #     independence is actually measured, and on run 1 it produced the most
  #     informative output of the day.
  #   - `adversary_on_the_largest_findings_only` reintroduced run 1's central flaw:
  #     an unjudged finding defaults to mostly-priced, so judging only some findings
  #     mechanically favours whichever side goes unattacked. Full adversary coverage
  #     is now a floor, not a degradation step. It is also the cheapest part of the
  #     stage -- one agent per ticker regardless of finding count.
  edge_degrade_order:
    - drop_unconfirmed_names_first          # the sweep could not source a date
    - drop_lowest_hunt_priority_names       # fewest names, full rigour on each
    - hunt_only_names_the_sweep_ranked_above_median_priority
  # `single_hunter_on_every_name` used to sit here as a last resort. It is the
  # default since 2026-09-09, so there is nothing left to shed but names.
  # Never degraded, at any budget: the sealed-baseline-before-launch ordering, the
  # two-hunter split on the top two names, and -- ON AUDIT DAY ONLY -- adversary
  # coverage of every finding on both sides. Full coverage stopped being a daily
  # floor on 2026-09-09 when both of the adversary's numeric channels were measured
  # as subtractive; on audit day it is still all-or-nothing, because judging only
  # some findings reintroduces run 1's central flaw (an unjudged finding defaults to
  # mostly-priced, so partial coverage favours whichever side goes unattacked).
  # One rule left, and it is the one that makes the whole exercise honest: a
  # baseline written after a finding exists is one the finding has contaminated.
  edge_never_degrade:
    - baselines_sealed_and_committed_before_any_agent_launches

execution:
  # Stage E's ranking placed as real orders at Alpaca, by scripts/alpaca_trade.py.
  # OFF until someone turns it on deliberately. With `enabled: false` every
  # invocation is a dry run that writes alpaca-plan.json and submits nothing, and
  # --submit alone will not override it.
  enabled: false
  broker: alpaca
  # The endpoint comes from $ALPACA_BASE_URL and defaults to the paper API. A
  # non-paper endpoint additionally needs --live-account-i-understand on the
  # command line. Credentials are read from $ALPACA_API_KEY_ID and
  # $ALPACA_API_SECRET_KEY and are never written into this repo.
  assumed_equity_usd: 100000     # sizing basis for dry runs with no account attached

  benchmark:
    # ONE rule, and it is the only cut in docs/EDGE_ANALYSIS.md that survived a
    # family-wise correction: |impact_sum| >= the floor, side from the sign. Above
    # the floor the sign was right on 16 of 21 events, +6.37% per trade (t=2.74,
    # +4.87% after a 1.5% cost); over all 38 events it is 53%, a coin flip. That is
    # 5 independent days. Do not raise the exposure below on the strength of it.
    key: impact_sum
    min_conviction: null         # null inherits edge_hunt.conviction_floor (3.0)
    require_rankable: true       # an unconfirmed event is not a trade
    # Capacity, which is in neither the scorer nor the budget. Names below this floor
    # are dropped outright rather than sized down.
    #
    # $200k since 2026-09-10, down from $5m, on the operator's reading that the real
    # spread in these names is far below the 1.5% round trip the analysis charges.
    # BE CLEAR ABOUT WHAT THAT COSTS: on the 38 resolved events the floor helped
    # monotonically -- $5m gave 11/12 and +8.09% a trade against 15/18 and +5.86% at
    # $200k -- so this loosening is against the sample, not with it. It is defensible
    # on two grounds the sample cannot speak to: the spread, and the event rate (18
    # of 38 events trade here against 12 at $5m, which is how the forward sample
    # grows). Re-run scripts/edge_turnover_floor.py as days pool and move it back if
    # the added names keep underperforming.
    min_dollar_volume_usd: 200000
    # No cap on the count. Equal weight means more names is smaller positions, not
    # more risk, and cutting the tail would be a second selection rule on top of the
    # only one that was measured.
    max_positions: null

  sizing:
    # EQUAL WEIGHT, WHOLE BUDGET. Every name that clears the benchmark gets the same
    # dollars: the gross budget split N ways, capped per name, with whatever a capped
    # name cannot take redistributed equally over the rest. Nothing here reads the
    # score. `impact_sum` ranks and does not size -- median absolute error 6-7 points
    # against a realised standard deviation near 11 -- so weighting by it would be
    # sizing on a number that has no measured relationship to the size of the move.
    #
    # 100% gross is the whole account, unhedged, through five to nine earnings prints
    # a night. Two names in the resolved sample gapped 22-23% (NX +22.23%,
    # CANG -23.01%): at a 20% weight either one moves the account by about 4.5%.
    # Reg T allows twice equity overnight, so 100% fits, but nothing here is a stop.
    gross_exposure_pct_of_equity: 100
    max_position_pct_of_equity: 20
    # Below five names every position hits that 20% and the account is deliberately
    # under-deployed. That is the cap doing its job, not a bug to route around.
    #
    # Slippage guard, kept but loose: a market-on-close order this size is a share of
    # the closing auction, and in a thin name that share is the cost. At $10k of
    # equity a 20% position is $2,000, which is 1% of a $200k/day name -- so this
    # only starts binding as the account grows. Set to null to disable it entirely;
    # the plan prints %adv per name either way.
    max_position_pct_of_adv: 1.0
    min_position_usd: 200

  orders:
    # Sell everything at the start of the run, at market, before the new book goes
    # in. The account is rebuilt from scratch every day.
    #
    # This is safe at that moment for one reason: when the edge hunt fires, every
    # position in the account has already been through its print, so nothing is cut
    # short of its event. It is NOT free. The measured exit is the next CLOSE
    # (direction rho=+0.514, permutation p=0.0015); selling at the start of the run
    # is nearer the next OPEN, which measured weaker on the same events (rho=+0.331,
    # p=0.046). Ten to twenty basis points of that gap is the price of a one-run-a-day
    # operation with no overnight order to babysit.
    flatten_before_entry: true
    # BUY IMMEDIATELY, at market, the moment the note is published -- not in the
    # closing auction, which is the entry edge_resolve.py scores.
    #
    # Measured both ways on the same 18 traded events: market-on-close 15/18 and
    # +5.86% a trade, a market order at 14:00 ET 14/18 and +5.82%. Four hundredths
    # of a point per trade, and one event of eighteen changing sign (PL, 09-03).
    # Re-run scripts/edge_entry_timing.py as days pool.
    #
    # What that measurement CANNOT see is the spread. It compares trade prices, not
    # fills, and the closing auction is the deepest liquidity of the day -- which
    # matters more since the turnover floor dropped to $200k, not less. If fills come
    # back worse than the plan's notional by more than a few tenths of a percent,
    # this is the first knob to put back: `market_on_close` returns to the auction,
    # at the cost of a pending order and Alpaca's cutoff ten minutes before the bell.
    entry: market
    # Only `close` reads this, and `close` is the fallback path (see
    # flatten_before_entry). There the auction is free: the order goes in on the exit
    # date with nothing else waiting on it.
    exit: market_on_close
    time_in_force: day           # market entries, and the plain-market fallback
    allow_shorts: true           # a short leg also needs Alpaca to call it shortable
