	    <style type="text/css">
		
          /**********font-import******/

            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap');



            body,
            .tabItem {
                font-family: 'Montserrat', sans-serif;
                color: #212529;	
				
            }
            .tabItem{
                font-size: 16px;;
            }
            body {
                margin:0;
            }
            div {
                display: block;
            }
            iframe {
				padding: 0;	
				margin: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }
            .tabs {
	            text-align: center;	
	            border-bottom: 0px;
	            font-size: 0px !important;
                padding:0;
                margin-top: 25px;
                max-width: 1200px;
                margin: 0 auto;
                background: #004e87;
            }

            .tabs li {
	            float: none;
	            display: inline-block;	
	            margin: 0px;
            }

            .tabItem {
	                height: auto;
	                line-height: normal;	
	                padding-top: 1em !important;
	                padding-bottom: 1em !important;
                    padding-right: 1em !important;
	                padding-left: 1em !important;
	                /* margin-left: 1.0em;
	                margin-right: 1.0em; */
	                text-decoration: none;
	                font-weight:bold;
	                font-style: normal;
	                text-transform: uppercase;
	                border: 0em solid #fff;
                    font-family: 'Montserrat', sans-serif;
	                               
                    display: inline-block;
                    background: #004e87;
                    color: #fff;
                    letter-spacing: 0.25px;
            }
            .tab-content {
                padding-top: 35px;
            }
            .tabItem:hover,
            .tabItem:active {
	            background: #fff;	
	            text-decoration: none;
	            font-weight: bold;
	            font-style: normal;	
	            color: #2c2a29;				
            }

            .tab-active,
            .tab-active:hover {
	            background: #fff;
	            position: relative;
	            top: 0px;
                left: 0px;
                color: #2c2a29;
            }

        <script type="text/javascript">
            $(document).ready(function () {
			/* add this */ EurolandToolAutoSizeObject.load(document.getElementById('main'));
            /* add this */ EurolandToolIntegrationObject.set("EuroID", null, true);
                // Tab setup
                $('.tabs a').click(function (e) {
                    e.preventDefault();
                    var $this = $(this),
                    role = $this.attr('role');

                    if ($this.hasClass('.tab-active')) {
                        return;
                    }
                    $this.parent().siblings().children('a.tab-active').removeClass('tab-active');

                    $this.addClass('tab-active');
                    
                    if (role == 'tab1') {
						$('#EuroID').attr('src', '/tools/ee/?companycode=es-ozt&lang=en');						                     
                    }
                    if (role == 'tab2') {
                        $('#EuroID').attr('src', '/tools/ee/?companycode=es-oztclsb&lang=en');   
                    }
                    if (role == 'tab3') {
                        $('#EuroID').attr('src', '/tools/ee/?pid=5&companycode=es-ozt&lang=en');
                    }
                    if (role == 'tab4') {
                        $('#EuroID').attr('src', '/tools/ee/?pid=2&companycode=es-ozt&lang=en');
                    }
                    return false;
                })
            });
        </script>
