              </header>
              <script>
                $(function () {
                  // HTMLを初期化
                  $("div.whatsnew").html("");

                  // HTMLを生成
                  $.getJSON("ir/whatsnew.json", function (data) {
                    var count = 0;  // 出力数をカウントする変数
                    $(data.whatsnew).each(function () {
                      if (count < 5) {  // 出力数が5未満の場合に処理を実行
                        // DATEを「YYYYMMDD」の形式から「YYYY.MM.DD」に変換
                        var rawDate = this.DATE;

                        // 8桁の数字形式（YYYYMMDD）の場合
                        if (rawDate.length === 8 && /^\d{8}$/.test(rawDate)) {
                          var year = rawDate.substring(0, 4);
                          var month = rawDate.substring(4, 6);
                          var day = rawDate.substring(6, 8);

                          // 「YYYY.MM.DD」の形式に変換
                          var formattedDate = year + '.' + month + '.' + day;
                        } else {
                          // 無効な日付の場合
                          console.error('Invalid date format: ' + rawDate);
                          return true;  // 無効な日付の場合、次のデータへ進む
                        }

                        // HTMLを生成して追加
                        $('<dl>' +
                          '<dt>' + formattedDate + '</dt>' +
                          '<dd><a href="' + this.LINK + '" target="' + this.target + '">' + this.TITLE + '</a></dd>' +
                          '</dl>').appendTo('div.whatsnew');

                        count++;  // 出力数を増やす
                      } else {
                        return false;  // 5個以上出力されたらループを終了
                      }
                    });
                  });
                });
              </script>
