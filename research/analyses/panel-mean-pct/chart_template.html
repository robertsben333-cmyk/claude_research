<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel threshold sweep</title>
<style>
:root{--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#8a8984;--grid:#e6e5e1;--s1:#2a78d6;--s2:#eb6834;--band:rgba(42,120,214,.14);--bar:#2a78d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--muted:#8f8e86;--grid:#2e2e2c;--s1:#3987e5;--s2:#d95926;--band:rgba(57,135,229,.20);--bar:#3987e5}}
:root[data-theme="dark"]{--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--muted:#8f8e86;--grid:#2e2e2c;--s1:#3987e5;--s2:#d95926;--band:rgba(57,135,229,.20);--bar:#3987e5}
body{margin:0;background:var(--surface);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 6px}
p,li{color:var(--text2);margin:4px 0}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin:8px 0}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
svg{width:100%;height:auto;display:block;overflow:visible}
.ax text{fill:var(--muted);font-size:11px}.ax line{stroke:var(--grid)}
#tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--grid);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:none;color:var(--text)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;white-space:nowrap;border-bottom:1px solid var(--grid);text-align:right}th{color:var(--text2);font-weight:600}
td:nth-child(-n+3),th:nth-child(-n+3){text-align:left}
.wrap{overflow-x:auto}
</style></head><body><main>
<h1>Stage E-P, October: the highest panel scores against what they returned</h1>
<p id="sub"></p>
<div class="legend"><span><span class="sw" style="background:var(--s1)"></span>close to close (± 1 se band)</span><span><span class="sw" style="background:var(--s2)"></span>strategy exit</span><span><span class="sw" style="background:var(--muted)"></span>short every name, no research (dashed)</span></div>
<svg id="ret" viewBox="0 0 900 330" role="img" aria-label="Average return per trade by threshold"></svg>
<h2>Names traded at each threshold</h2>
<svg id="cnt" viewBox="0 0 900 170" role="img" aria-label="Number of names by threshold"></svg>
<h2>The names</h2>
<div class="wrap"><table id="tbl"></table></div>
<p style="margin-top:14px">Gross of costs. Research only, not investment advice.</p>
<div id="tip"></div>
<script>
const D=__DATA__;
const C=D.curve, W=900, L=56, R=20;
const xmax=Math.ceil(Math.max(...C.map(p=>p.x))*2)/2;
const X=x=>L+(W-L-R)*x/xmax;
const f=(v,d=2)=>(v>=0?'+':'')+v.toFixed(d);
document.getElementById('sub').textContent=
 `Each judge's impact_sum rescaled so every model's median |size| is the same (${Object.entries(D.factor).map(([m,v])=>m+' ×'+v.toFixed(2)).join(', ')}), then averaged. At each threshold: every resolved name with |average| at or above it, traded on the sign, equal weight. ${D.resolved} resolved names of ${D.names}, six days (5 to 12 October). The current 3-of-4 rule picked ${D.current_rule_selected.n} of them at ${f(D.current_rule_selected.mean_mv_close)}%.`;
function ns(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)e.setAttribute(k,a[k]);return e}
function axisX(svg,y0,h){const g=ns('g',{class:'ax'});for(let x=0;x<=xmax+1e-9;x+=0.5){g.append(ns('line',{x1:X(x),x2:X(x),y1:y0,y2:y0+h,'stroke-width':1}));const t=ns('text',{x:X(x),y:y0+h+16,'text-anchor':'middle'});t.textContent=x.toFixed(1);g.append(t)}svg.append(g)}
// return chart
(function(){const s=document.getElementById('ret'),T=12,H=280;
 const pts=C.filter(p=>p.n>=2);
 const lo=Math.min(-2,...pts.map(p=>p.mv_close.mean-(p.mv_close.se||0)),...pts.map(p=>p.mv_strategy.mean));
 const hi=Math.max(...pts.map(p=>p.mv_close.mean+(p.mv_close.se||0)),...pts.map(p=>p.mv_strategy.mean));
 const ymin=Math.floor(lo/2)*2,ymax=Math.ceil(hi/2)*2,Y=v=>T+H*(ymax-v)/(ymax-ymin);
 const g=ns('g',{class:'ax'});for(let v=ymin;v<=ymax;v+=2){g.append(ns('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),'stroke-width':v===0?1.5:1}));const t=ns('text',{x:L-8,y:Y(v)+4,'text-anchor':'end'});t.textContent=f(v,0)+'%';g.append(t)}s.append(g);
 axisX(s,T,H);
 const xl=ns('text',{x:(L+W-R)/2,y:T+H+32,'text-anchor':'middle',fill:'var(--text2)','font-size':12});xl.textContent='threshold on |average panel size|, points';s.append(xl);
 // step paths: value holds from x_i to x_{i+1}
 const step=(k,off=0)=>pts.map((p,i)=>{const x2=i<pts.length-1?pts[i+1].x:p.x;return `${i?'L':'M'}${X(p.x)},${Y(k(p)+off)} L${X(x2)},${Y(k(p)+off)}`}).join(' ');
 const up=pts.map((p,i)=>{const x2=i<pts.length-1?pts[i+1].x:p.x;const v=p.mv_close.mean+(p.mv_close.se||0);return `${i?'L':'M'}${X(p.x)},${Y(v)} L${X(x2)},${Y(v)}`}).join(' ');
 const dn=pts.slice().reverse().map((p,i,a)=>{const j=pts.length-1-i;const x2=j<pts.length-1?pts[j+1].x:p.x;const v=p.mv_close.mean-(p.mv_close.se||0);return `L${X(x2)},${Y(v)} L${X(p.x)},${Y(v)}`}).join(' ');
 s.append(ns('path',{d:up+' '+dn+' Z',fill:'var(--band)',stroke:'none'}));
 s.append(ns('line',{x1:L,x2:W-R,y1:Y(D.short_every_name_mv_close),y2:Y(D.short_every_name_mv_close),stroke:'var(--muted)','stroke-dasharray':'5 4','stroke-width':1.5}));
 s.append(ns('path',{d:step(p=>p.mv_strategy.mean),fill:'none',stroke:'var(--s2)','stroke-width':2}));
 s.append(ns('path',{d:step(p=>p.mv_close.mean),fill:'none',stroke:'var(--s1)','stroke-width':2}));
 const hl=ns('line',{y1:T,y2:T+H,stroke:'var(--muted)','stroke-width':1,visibility:'hidden'});s.append(hl);
 hover(s,hl,T,H);
})();
// count chart
(function(){const s=document.getElementById('cnt'),T=8,H=130,nmax=Math.max(...C.map(p=>p.n)),Y=v=>T+H*(1-v/nmax);
 const g=ns('g',{class:'ax'});for(let v=0;v<=nmax;v+=10){g.append(ns('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)}));const t=ns('text',{x:L-8,y:Y(v)+4,'text-anchor':'end'});t.textContent=v;g.append(t)}s.append(g);
 axisX(s,T,H);
 C.forEach((p,i)=>{const x2=i<C.length-1?C[i+1].x:xmax;const w=Math.max(1,X(x2)-X(p.x)-2);s.append(ns('rect',{x:X(p.x)+1,y:Y(p.n),width:w,height:Math.max(0,Y(0)-Y(p.n)),fill:'var(--bar)',opacity:.75,rx:2}))});
 const hl=ns('line',{y1:T,y2:T+H,stroke:'var(--muted)','stroke-width':1,visibility:'hidden'});s.append(hl);hover(s,hl,T,H);
})();
function hover(s,hl,T,H){const tip=document.getElementById('tip');
 const hit=ns('rect',{x:L,y:T,width:W-L-R,height:H,fill:'transparent'});s.append(hit);
 hit.addEventListener('mousemove',e=>{const r=s.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,v=(x-L)/(W-L-R)*xmax;
  let p=C[0];for(const q of C)if(q.x<=v)p=q;
  hl.setAttribute('x1',X(p.x));hl.setAttribute('x2',X(p.x));hl.setAttribute('visibility','visible');
  const c=p.mv_close,st=p.mv_strategy;
  tip.innerHTML=`<b>|average| ≥ ${p.x.toFixed(2)}</b><br>${p.n} names over ${p.days} days<br>close to close <b>${f(c.mean)}%</b>${c.se?` (se ${c.se.toFixed(2)})`:''}, ${Math.round(c.hit*100)}% right<br>strategy exit ${f(st.mean)}%`;
  tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-230)+'px';tip.style.top=(e.clientY+14)+'px'});
 hit.addEventListener('mouseleave',()=>{tip.style.display='none';hl.setAttribute('visibility','hidden')});}
// table
(function(){const rows=D.rows.slice().sort((a,b)=>Math.abs(b.avg_pct)-Math.abs(a.avg_pct));
 const ms=['opus5','opus55','sonnet55','fable51'];
 let h='<tr><th>date</th><th>ticker</th><th>session</th><th>average</th>'+ms.map(m=>`<th>${m}</th>`).join('')+'<th>3 of 4</th><th>move close</th><th>trade return</th></tr>';
 for(const r of rows){const tr=Math.sign(r.avg_pct)*r.mv_close;h+=`<tr><td>${r.date}</td><td>${r.ticker}</td><td>${r.session||''}</td><td>${f(r.avg_pct)}</td>${ms.map(m=>`<td>${f(r.scaled[m])}</td>`).join('')}<td>${r.selected?'yes':''}</td><td>${f(r.mv_close)}%</td><td>${f(tr)}%</td></tr>`}
 document.getElementById('tbl').innerHTML=h})();
</script></main></body></html>
