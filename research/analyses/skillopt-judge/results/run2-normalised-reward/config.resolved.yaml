# SkillOpt config for the US panel judge. `_base_` is filled in by run.py with the
# absolute path of the SkillOpt checkout's configs/_base_/default.yaml.
_base_: "/tmp/claude-0/-home-user-claude-research/a66a477f-4f27-5120-9a15-b2b21a1e8a9a/scratchpad/skillopt/configs/_base_/default.yaml"

env:
  name: us_judge
  skill_init: "/home/user/claude_research/research/analyses/skillopt-judge/seed_skill.md"
  split_mode: split_dir
  split_dir: "/home/user/claude_research/research/analyses/skillopt-judge/data"
  workers: 8

model:
  optimizer: claude-opus-5-5
  target: claude-sonnet-5-5
  optimizer_backend: claude_chat
  target_backend: claude_chat      # the adapter calls the judge itself (no tools, no CLAUDE.md)
  reasoning_effort: high           # optimizer only

train:
  num_epochs: 2
  batch_size: 20                   # 60 train names -> 3 steps an epoch, 6 steps in all
  seed: 20261005

gradient:
  minibatch_size: 10
  merge_batch_size: 8
  analyst_workers: 4
  failure_only: false

optimizer:
  learning_rate: 3                 # at most 3 edits a step
  min_learning_rate: 1
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: true
  slow_update_gate_with_selection: true   # the epoch-end update passes the same gate
  use_meta_skill: true

evaluation:
  use_gate: true
  gate_metric: soft
  sel_env_num: 0                   # the whole gate set, every step
  test_env_num: 0
  eval_test: true                  # readout on the judge-lab validation days
